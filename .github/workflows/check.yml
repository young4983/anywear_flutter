name: Android and iOS checks
on:
  push:
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: git diff --exit-code -- '*.g.dart'
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s backend -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check Decart Swift toolchain requirement
        run: |
          swift --version
          python3 - <<'PY'
          import re, subprocess
          version = subprocess.check_output(['swift', '--version'], text=True)
          match = re.search(r'Swift version (\d+)\.(\d+)(?:\.(\d+))?', version)
          assert match and tuple(int(v or 0) for v in match.groups()) >= (6, 2, 1), 'Decart SDK requires Swift 6.2.1+'
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build ios --debug --no-codesign
