name: fitting_room
description: Android and iOS realtime virtual fitting room powered by Decart.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  decart_vton_flutter:
    path: packages/decart_vton_flutter
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  flutter_secure_storage: ^11.2.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true
